mojito:
  user: alice
  category: cocktails
  title: Classic Mojito
  description: A refreshing Cuban highball with rum, mint, and lime.
  directions: Muddle mint leaves with sugar. Add rum and lime juice. Fill with ice and top with soda water.
  comments_count: 2

margarita:
  user: bob
  category: cocktails
  title: Margarita
  description: A classic tequila cocktail with lime and orange liqueur.
  directions: Shake tequila, lime juice, and triple sec with ice. Strain into a salt-rimmed glass.
  comments_count: 0

virgin_mojito:
  user: alice
  category: mocktails
  title: Virgin Mojito
  description: All the refreshment of a mojito without the alcohol.
  directions: Muddle mint with sugar, add lime juice and soda water over ice.
  comments_count: 0
